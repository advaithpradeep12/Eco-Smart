<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Review · Smart Eco-Campus</title>
<style>
:root{font-family:Arial,sans-serif;color:#17342e;background:#f5f5e9}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:1050px;margin:auto}.panel{background:white;border:1px solid #dce7d6;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 24px #173d330b}h1,h2{margin-top:0}.muted{color:#627b70}.field{display:block;width:100%;padding:12px;border:1px solid #cbdccf;border-radius:9px;margin:8px 0 14px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer;background:#185b47;color:white}.btn.secondary{background:#eef5ea;color:#185b47;border:1px solid #b9d1bf}.error{color:#9b3025}.item{border:1px solid #dce7d6;border-radius:14px;padding:16px;margin:14px 0;display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:18px}.item img{width:100%;height:auto;max-height:440px;object-fit:contain;background:#f3f5ef;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tag{display:inline-block;background:#fff1df;color:#805019;border-radius:20px;padding:5px 10px;font-size:13px;font-weight:bold}@media(max-width:650px){body{padding:12px}.item{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><p><a href="/" style="color:#185b47">← Back to campus dashboard</a></p><h1>Staff uniform review</h1><p class="muted">Only authorized staff can view submitted frames. Verify each alert before taking action.</p>
<section id="login" class="panel" hidden><h2>Staff sign in</h2><form id="login-form"><label for="password">Staff password</label><input class="field" id="password" type="password" autocomplete="current-password" required><button class="btn">Sign in</button></form><p id="login-message" class="error" role="status"></p></section>
<section id="reviews-panel" hidden><div class="panel"><button id="refresh" class="btn secondary">Refresh</button> <button id="logout" class="btn secondary">Sign out</button><p id="status" class="muted" role="status"></p></div><div id="reviews"></div></section></main>
<script>
const $=id=>document.getElementById(id);
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed.');return d}
async function checkSession(){try{const d=await api('/api/staff/session');$('login').hidden=d.authenticated;$('reviews-panel').hidden=!d.authenticated;if(d.authenticated)await loadReviews()}catch{$('login').hidden=false}}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();$('login-message').textContent='Signing in…';try{await api('/api/staff/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';$('login-message').textContent='';await checkSession()}catch(err){$('login-message').textContent=err.message}});
async function loadReviews(){ $('status').textContent='Loading submitted frames…';try{const d=await api('/api/staff/reviews');const host=$('reviews');host.replaceChildren();if(!d.reviews.length){host.textContent='No uniform issues are waiting for review.';}d.reviews.forEach(item=>{const card=document.createElement('article');card.className='item';const img=document.createElement('img');img.src=item.image;img.alt='Submitted uniform frame';const body=document.createElement('div');const title=document.createElement('h2');title.textContent=item.reviewed?'Reviewed uniform alert':'Incorrect uniform — staff review required';const missing=document.createElement('p');missing.textContent='Missing: '+item.missingItems.map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(', ');const time=document.createElement('p');time.className='muted';time.textContent=new Date(item.createdAt).toLocaleString();const tag=document.createElement('span');tag.className='tag';tag.textContent=item.reviewed?'Reviewed':'Awaiting review';const actions=document.createElement('div');actions.className='actions';if(!item.reviewed){const done=document.createElement('button');done.className='btn';done.textContent='Mark reviewed';done.onclick=async()=>{try{await api('/api/staff/reviews/'+item.id,{method:'PATCH'});await loadReviews()}catch(e){$('status').textContent=e.message}};actions.append(done)}const del=document.createElement('button');del.className='btn secondary';del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete this submitted frame?'))return;try{await api('/api/staff/reviews/'+item.id,{method:'DELETE'});await loadReviews()}catch(e){$('status').textContent=e.message}};actions.append(del);body.append(title,missing,time,tag,actions);card.append(img,body);host.append(card)});$('status').textContent=`${d.reviews.length} submitted frame(s).`; }catch(e){$('status').textContent=e.message}}
$('refresh').onclick=loadReviews;$('logout').onclick=async()=>{try{await api('/api/staff/logout',{method:'POST'})}finally{await checkSession()}};checkSession();
</script></body></html>
